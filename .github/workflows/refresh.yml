# Six-hourly refresh: run the pipeline, commit the new data, and GitHub Pages
# redeploys the dashboard from /docs on that push.
#
# Each run also reads new Thai SEC filings for officers and IR contacts
# (core/filings.py, rule-based, cached weekly) and spends a few Hunter.io
# searches and mailbox checks (core/hunter.py, one secret: HUNTER_API_KEY,
# within the free plan). Both caches are committed under data/enriched/.
# Without the secret the Hunter step is skipped and everything else runs.
# A second secret, ANTHROPIC_API_KEY, gives English to Thai/Chinese names and
# quotes that appear for the first time (tools/translate.py; only uncached
# strings, capped per run, cache committed). Model extraction of documents
# and website contact collection stay local (tools/) and are committed.
#
# If an exchange blocks GitHub's IP range, run.py keeps that exchange's rows
# from the previous run and marks them "stale" on the dashboard rather than
# publishing an empty table.

name: refresh-data

on:
  schedule:
    - cron: "17 */6 * * *"  # every 6 hours; 18:17 UTC = 02:17 Singapore/KL/Taipei, so one run lands before Asian markets open
  workflow_dispatch: {}      # "Run workflow" button for manual refreshes

permissions:
  contents: write            # to commit docs/data/ipos.json

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run pipeline
        run: python run.py
        env:
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit if the data changed
        run: |
          git config user.name  "ipo-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/ipos.json data/enriched/hunter data/enriched/filings data/enriched/translations.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
